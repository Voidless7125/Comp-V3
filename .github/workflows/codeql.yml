name: "CodeQL Advanced"

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '35 17 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Fetch and unzip the latest VEX V5 C++ SDK
      - name: Setup Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch latest VEX V5 C++ SDK version
        shell: pwsh
        run: |
          $manifestUrl = 'https://content.vexrobotics.com/vexos/public/V5/vscode/sdk/cpp/manifest.json'
          $manifest   = Invoke-RestMethod -Uri $manifestUrl
          $ver        = $manifest.latest
          Write-Host "SDK_VERSION=$ver" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8

      - name: Download and extract VEX C++ SDK
        shell: pwsh
        run: |
          $sdkZipName   = "${Env:SDK_VERSION}.zip"
          $sdkUrl       = "https://content.vexrobotics.com/vexos/public/V5/vscode/sdk/cpp/$sdkZipName"
          $destDir      = "$Env:GITHUB_WORKSPACE\tools\cpp\VEX_SDK\vexv5"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Invoke-WebRequest -Uri $sdkUrl -OutFile "$Env:GITHUB_WORKSPACE\$sdkZipName"
          Expand-Archive -LiteralPath "$Env:GITHUB_WORKSPACE\$sdkZipName" -DestinationPath $destDir

      # 2. Download and extract toolchain_win32.zip
      - name: Download and extract VEX toolchain_win32
        shell: pwsh
        run: |
          $tcUrl  = 'https://content.vexrobotics.com/vscode/resources/toolchain/win/toolchain_win32.zip'
          $outZip = "$Env:GITHUB_WORKSPACE\toolchain_win32.zip"
          $dest   = "$Env:GITHUB_WORKSPACE\tools\cpp\toolchain_win32"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $tcUrl -OutFile $outZip
          Expand-Archive -LiteralPath $outZip -DestinationPath $dest

      # 3. Download and extract ARM GCC 14.2.Rel1
      - name: Download and extract ARM GNU Toolchain (14.2.Rel1)
        shell: pwsh
        run: |
          $gccUrl  = 'https://developer.arm.com/-/media/Files/downloads/gnu-rm/14.2.rel1/gcc-arm-none-eabi-14.2.rel1-win32.zip'
          $outZip  = "$Env:GITHUB_WORKSPACE\gcc-arm-none-eabi-14.2-rel1.zip"
          $dest    = "$Env:GITHUB_WORKSPACE\tools\cpp\gcc-arm-none-eabi-14.2.rel1"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $gccUrl -OutFile $outZip
          Expand-Archive -LiteralPath $outZip -DestinationPath $dest

      # 4. Replace GCC binaries in the VEX toolchain
      - name: Replace ARM GCC binaries in toolchain_win32
        shell: pwsh
        run: |
          $srcBin = "$Env:GITHUB_WORKSPACE\tools\cpp\gcc-arm-none-eabi-14.2.rel1\gcc-arm-none-eabi-14.2.Rel1\bin"
          $dstBin = "$Env:GITHUB_WORKSPACE\tools\cpp\toolchain_win32\gcc\bin"
          Copy-Item -Path "$srcBin\arm-none-eabi-ar.exe"    -Destination $dstBin -Force
          Copy-Item -Path "$srcBin\arm-none-eabi-ld.exe"    -Destination $dstBin -Force
          Copy-Item -Path "$srcBin\arm-none-eabi-objcopy.exe" -Destination $dstBin -Force
          Copy-Item -Path "$srcBin\arm-none-eabi-size.exe"  -Destination $dstBin -Force

      # 5. Download and extract Clang 20.1.6, then replace clang.exe
      - name: Download and extract LLVM/Clang 20.1.6
        shell: pwsh
        run: |
          $clangUrl = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.6/clang+llvm-20.1.6-win64.zip'
          $outZip   = "$Env:GITHUB_WORKSPACE\clang-20.1.6.zip"
          $dest     = "$Env:GITHUB_WORKSPACE\tools\cpp\clang-20.1.6"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $clangUrl -OutFile $outZip
          Expand-Archive -LiteralPath $outZip -DestinationPath $dest

      - name: Replace clang.exe in toolchain_win32
        shell: pwsh
        run: |
          # The extracted folder has a nested structure
          $extractedDir = Get-ChildItem -Path "$Env:GITHUB_WORKSPACE\tools\cpp\clang-20.1.6" -Directory | Select-Object -First 1
          $srcClangExe = "$($extractedDir.FullName)\bin\clang.exe"
          $dstClangDir = "$Env:GITHUB_WORKSPACE\tools\cpp\toolchain_win32\clang\bin"
          Copy-Item -Path $srcClangExe -Destination $dstClangDir -Force

      # 6. Download and extract GNU Make 4.4.1, then replace make.exe
      - name: Download and extract GNU Make 4.4.1
        shell: pwsh
        run: |
          $makeUrl = 'https://sourceforge.net/projects/ezwinports/files/make-4.4.1-without-guile-w32-bin.zip/download'
          $outZip  = "$Env:GITHUB_WORKSPACE\make-4.4.1.zip"
          $dest    = "$Env:GITHUB_WORKSPACE\tools\cpp\make-4.4.1"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $makeUrl -OutFile $outZip
          Expand-Archive -LiteralPath $outZip -DestinationPath $dest

      - name: Replace make.exe in toolchain_win32
        shell: pwsh
        run: |
          $srcMakeExe = "$Env:GITHUB_WORKSPACE\tools\cpp\make-4.4.1\bin\make.exe"
          $dstMakeDir = "$Env:GITHUB_WORKSPACE\tools\cpp\toolchain_win32\tools\bin"
          Copy-Item -Path $srcMakeExe -Destination $dstMakeDir -Force

      # 7. Update PATH so that make, clang, and ARM GCC are available
      - name: Add toolchain to PATH
        shell: pwsh
        run: |
          $tcRoot = "$Env:GITHUB_WORKSPACE\tools\cpp\toolchain_win32"
          $gccBin = "$tcRoot\gcc\bin"
          $clangBin = "$tcRoot\clang\bin"
          $makeBin = "$tcRoot\tools\bin"
          # Append each directory to GITHUB_PATH so all subsequent steps see them
          "`"$gccBin`""   | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          "`"$clangBin`""| Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          "`"$makeBin`"" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      # 8. Initialize CodeQL (using manual build mode)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # 9. Build the project directly without makefile (replicating makefile logic)
      - name: Build project (integrated makefile logic)
        shell: pwsh
        run: |
          # Set variables from makefile
          $PLATFORM = "vexv5"
          $BUILD = "build"
          $PROJECT = Split-Path -Leaf $Env:GITHUB_WORKSPACE
          $VEX_SDK_PATH = "$Env:GITHUB_WORKSPACE\tools\cpp\VEX_SDK"
          $HEADERS = "20"
          
          # Create build directory
          New-Item -ItemType Directory -Force -Path $BUILD | Out-Null
          
          # Compiler and linker paths
          $CC = "clang"
          $CXX = "clang"
          $OBJCOPY = "arm-none-eabi-objcopy"
          $SIZE = "arm-none-eabi-size"
          $LINK = "arm-none-eabi-ld"
          
          # Include paths
          $TOOL_INC = "-I`"$VEX_SDK_PATH/$PLATFORM/clang/$HEADERS/include`" -I`"$VEX_SDK_PATH/$PLATFORM/gcc/include/c++/14.2.1`" -I`"$VEX_SDK_PATH/$PLATFORM/gcc/include/c++/14.2.1/arm-none-eabi/thumb/v7-a+fp/softfp`" -I`"$VEX_SDK_PATH/$PLATFORM/gcc/include`""
          $INC = "-Iinclude -I`"$VEX_SDK_PATH/$PLATFORM/include`" $TOOL_INC"
          
          # Compiler flags
          $CFLAGS_CL = "-target thumbv7-none-eabi -fshort-enums -Wno-unknown-attributes -U__INT32_TYPE__ -U__UINT32_TYPE__ -D__INT32_TYPE__=long -D__UINT32_TYPE__='unsigned long'"
          $CFLAGS_V7 = "-march=armv7-a -mfpu=neon -mfloat-abi=softfp"
          $DEFINES = "-DVexV5"
          $CFLAGS = "$CFLAGS_CL $CFLAGS_V7 -Os -Wall -Wextra -Werror=return-type -std=gnu23 $DEFINES"
          $CXX_FLAGS = "$CFLAGS_CL $CFLAGS_V7 -Os -Wall -Wextra -Wno-cast-function-type-mismatch -Wno-unused-parameter -Werror=return-type -fno-rtti -fno-threadsafe-statics -std=gnu++23 -ffunction-sections -fdata-sections $DEFINES"
          
          # Find all source files recursively
          $SRC_CPP = Get-ChildItem -Path "src" -Recurse -Include "*.cpp" -ErrorAction SilentlyContinue
          $SRC_C = Get-ChildItem -Path "src" -Recurse -Include "*.c" -ErrorAction SilentlyContinue
          
          # Compile C++ files
          foreach ($file in $SRC_CPP) {
            $relPath = $file.FullName.Substring($Env:GITHUB_WORKSPACE.Length + 1)
            $objFile = "$BUILD\$($relPath -replace '\.cpp$','.o' -replace '[\\/]','_')"
            Write-Host "CXX $relPath"
            & $CXX $CXX_FLAGS.Split() $INC.Split() -c -o $objFile $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          
          # Compile C files
          foreach ($file in $SRC_C) {
            $relPath = $file.FullName.Substring($Env:GITHUB_WORKSPACE.Length + 1)
            $objFile = "$BUILD\$($relPath -replace '\.c$','.o' -replace '[\\/]','_')"
            Write-Host "CC  $relPath"
            & $CC $CFLAGS.Split() $INC.Split() -c -o $objFile $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          
          # Get all object files
          $OBJ_FILES = Get-ChildItem -Path $BUILD -Filter "*.o"
          
          # Link
          Write-Host "LINK $BUILD/$PROJECT.elf"
          $LNK_FLAGS = "--no-warn-rwx-segments --no-warn-execstack -nostdlib -T `"$VEX_SDK_PATH/$PLATFORM/lscript.ld`" -R `"$VEX_SDK_PATH/$PLATFORM/stdlib_0.lib`" -Map=`"$BUILD/$PROJECT.map`" --gc-section -L`"$VEX_SDK_PATH/$PLATFORM`" -L`"$VEX_SDK_PATH/$PLATFORM/gcc/libs`""
          $LIBS = "--start-group -lv5rt -lstdc++ -lc -lm -lgcc --end-group"
          
          $objPaths = $OBJ_FILES | ForEach-Object { $_.FullName }
          & $LINK $LNK_FLAGS.Split() -o "$BUILD/$PROJECT.elf" $objPaths $LIBS.Split()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          & $SIZE "$BUILD/$PROJECT.elf"
          
          # Create binary
          & $OBJCOPY -O binary "$BUILD/$PROJECT.elf" "$BUILD/$PROJECT.bin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 10. Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
